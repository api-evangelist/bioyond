aid: bioyond
name: Bioyond Robotics
description: >-
  Bioyond Robotics (奔曜科技) is a life-sciences intelligent-automation company founded in 2021 and
  headquartered in Shanghai's Zhangjiang Science City. It combines robotics, machine vision, and
  artificial intelligence to build autonomous laboratory solutions for scientific research, drug
  discovery, applied chemistry, synthetic biology, multiomics, and clinical diagnostics. Its product
  line spans the LabGenius robot platform (liquid-handling and transport robots), the LabMate
  automation platform (material/liquid handling, stackers, and intelligent scheduling), the LabMind
  laboratory software platform for integrating external instruments and modules, and the BIOYOND
  AutoSeq genetic-analysis system. Bioyond is backed by Qiming Venture Partners. As of this profile
  the company exposes no public developer API, SDK, or developer portal — this record captures its
  identity and domain-security posture only.
